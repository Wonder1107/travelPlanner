[project]
name = "travel-agent-backend"
version = "0.1.0"
description = "Dynamic itinerary engine backend for travel planning MVP"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.111.1",
  "uvicorn[standard]==0.30.6",
  "sqlmodel==0.0.22",
  "httpx==0.27.2",
  "pydantic==2.8.2",
  "openai==1.51.2",
  "chromadb==0.5.5",
  "langgraph==0.2.20",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
